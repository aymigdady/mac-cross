# Cloud Build → Artifact Registry → Cloud Run (trigger: push to main on mac-cross)
options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

substitutions:
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _AR_PROJECT_ID: mac-cost-intellegence
  _AR_REPOSITORY: cloud-run-source-deploy
  _DEPLOY_REGION: us-central1
  _SERVICE_NAME: mac-cross
  _VPC_CONNECTOR: ccapr-run-connector
  _REDIS_SECRET: ccapr-redis-url
  _CROSS_TOKEN_SECRET: ccapr-cross-service-token
  _ANTHROPIC_SECRET: ccapr-anthropic-api-key
  _GCS_BUCKET: mac-cost-intellegence-ccapr-artifacts

steps:
  - name: gcr.io/cloud-builders/docker
    id: Build
    args:
      - build
      - --no-cache
      - -t
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - .
      - -f
      - Dockerfile

  - name: gcr.io/cloud-builders/docker
    id: Push
    args:
      - push
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA"
        ENV_VARS="CCAPR_HNSW_CACHE_DIR=/tmp/ccapr-hnsw-cache"
        ENV_VARS="$$ENV_VARS,CCAPR_GCS_BUCKET=$_GCS_BUCKET"
        ENV_VARS="$$ENV_VARS,CCAPR_ENABLE_EMBEDDINGS=1"
        ENV_VARS="$$ENV_VARS,CCAPR_ENABLE_EMBEDDINGS_PER_COMPANY=MBL,IFAS,MSB"
        ENV_VARS="$$ENV_VARS,CCAPR_USE_CROSS_ENCODER=1"
        ENV_VARS="$$ENV_VARS,CCAPR_USE_STRUCTURED_FILTERS=1"
        ENV_VARS="$$ENV_VARS,CCAPR_ATTR_LLM_FALLBACK=1"
        ENV_VARS="$$ENV_VARS,CCAPR_USE_QUERY_EXPANSION=1"
        ENV_VARS="$$ENV_VARS,CCAPR_QE_MAX_PARAPHRASES=4"
        ENV_VARS="$$ENV_VARS,CCAPR_HYBRID_BM25_TOP_K=40"
        ENV_VARS="$$ENV_VARS,CCAPR_HYBRID_EMB_TOP_K=40"
        ENV_VARS="$$ENV_VARS,CCAPR_HYBRID_UNION_MAX=80"
        ENV_VARS="$$ENV_VARS,CCAPR_CE_SKIP_HYBRID_TOP1=0"
        ENV_VARS="$$ENV_VARS,CCAPR_CE_SKIP_HYBRID_MARGIN=0"
        ENV_VARS="$$ENV_VARS,CCAPR_CROSS_CANDIDATES_PER_LINE=6"
        ENV_VARS="$$ENV_VARS,CCAPR_CROSS_REMATCH_CANDIDATES_PER_LINE=12"
        gcloud run deploy "$_SERVICE_NAME" \
          --platform=managed \
          --image="$$IMAGE" \
          --region="$_DEPLOY_REGION" \
          --project="$_AR_PROJECT_ID" \
          --vpc-connector="$_VPC_CONNECTOR" \
          --vpc-egress=private-ranges-only \
          --set-secrets="REDIS_URL=$_REDIS_SECRET:latest,ANTHROPIC_API_KEY=$_ANTHROPIC_SECRET:latest,CCAPR_CROSS_SERVICE_TOKEN=$_CROSS_TOKEN_SECRET:latest" \
          --update-env-vars="$$ENV_VARS" \
          --allow-unauthenticated \
          --max-instances=1 \
          --memory=4Gi \
          --cpu=2 \
          --timeout=300 \
          --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID \
          --quiet

images:
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA

tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - mac-cross
